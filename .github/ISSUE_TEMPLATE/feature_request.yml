name: 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目需求以 [`docs/feature-plan/01-requirements.md`](../../blob/main/docs/feature-plan/01-requirements.md) 为唯一事实来源。
        提交前请先看**非目标清单**（§1.2/§2.3）与 [`06-roadmap.md`](../../blob/main/docs/feature-plan/06-roadmap.md) 待定清单，避免与既定范围冲突。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题 / 场景
      description: 你想解决什么问题？谁在什么场景下遇到？（比"怎么做"更重要）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果有想法，描述你期望的交互或形态。
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你现在是怎么绕过这个问题的？还有什么别的解法？
  - type: dropdown
    id: scope
    attributes:
      label: 是否属于已知排后范围
      description: 多用户/公网化/Kanban/邮件/监控/代码插件安装器等见 01-requirements §1.2/§2.3。
      options:
        - "否，是新想法"
        - "是，但希望重新评估优先级"
        - "不确定"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已阅读非目标清单与 roadmap 待定清单
          required: true
        - label: 已搜索既有 Issue / 决策日志，没有相同提议
          required: true
