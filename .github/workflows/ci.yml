name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只读仓库
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自根 package.json 的 packageManager（固定 12.6.0）
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (oxlint + knip)
        run: pnpm lint

      - name: Unit & contract tests
        run: pnpm test

      # UI 行为验收（apps/web/scripts/verify-*.mjs）依赖真实 Chrome 与运行中的
      # server/preview，不在 CI 执行，请在本地按 CONTRIBUTING.md 自测。
