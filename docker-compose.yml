# 个人工作台 · 单镜像部署（NFR1）
# 用法：ADMIN_PASSWORD=xxx CREDENTIALS_MASTER_KEY=yyy docker compose up -d
# 备份/恢复见 docs/feature-plan/06-roadmap.md 与下方注释
services:
  all-in-one:
    build: .
    image: all-in-one:latest
    container_name: all-in-one
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # D17：首启必填（创建初始账号）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # SEC3：凭证加密主密钥（base64 32 字节）；生成：
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?CREDENTIALS_MASTER_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 公网化时置 1（SEC6）
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Gmail 接入（可选，D37）：Google Cloud OAuth 客户端（Web），见 docs/deploy.md
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      # 日志级别（deploy.md：debug|info|warn|error）
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 内网出站逃生阀（SEC4，慎用）：custom-api / 邮件组件以本机/内网服务为目标时置 1
      ALLOW_PRIVATE_OUTBOUND: ${ALLOW_PRIVATE_OUTBOUND:-0}
    volumes:
      # SQLite 库文件 + 插件安装目录 + 备份落点
      - ./data:/app/data
    # 内网出站（SEC4 逃生阀，慎用）：app-launcher / iframe 禁嵌检测 / OpenCode 探测
    # 本就放行内网目标（服务聚合场景，D22/D32）；custom-api 与邮件组件以本机/内网
    # 服务为目标时才需要置 1：
    # environment:
    #   ALLOW_PRIVATE_OUTBOUND: "1"

# 备份（任意时刻）：tar czf backup-$(date +%F).tar.gz ./data
# 恢复：停容器 → 解压 ./data → 启动容器
